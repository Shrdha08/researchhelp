[project]
name = "researchhelp"
version = "0.1.0"
description = "Research-paper Q&A and research-assistance system (RAG over uploaded PDFs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-groq>=1.0",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
researchhelp = "researchhelp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchhelp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that exercise several components together (no network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
