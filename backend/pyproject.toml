[project]
name = "researchhelp"
version = "0.1.0"
description = "Research-paper Q&A and research-assistance system (RAG over uploaded PDFs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-groq>=1.0",
    "qdrant-client>=1.15",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Pick exactly one: ONNX models (embeddings, reranker) on CPU or on an NVIDIA GPU.
#   uv sync --extra cpu    (Docker / VM)
#   uv sync --extra gpu    (local dev, NVIDIA GPU; CUDA 13 DLLs come from the nvidia-* wheels)
cpu = ["fastembed>=0.7"]
gpu = [
    # onnxruntime-gpu 1.30 is built against CUDA 13 + cuDNN 9 (needs a driver supporting CUDA 13).
    "fastembed-gpu>=0.7",
    "nvidia-cudnn-cu13>=9",
    "nvidia-cublas>=13",
    "nvidia-cuda-runtime>=13",
    "nvidia-cufft>=12",
    "nvidia-curand>=10.4",
    "nvidia-cuda-nvrtc>=13",
]

[project.scripts]
researchhelp = "researchhelp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# Resolve only versions that ship wheels for local Windows dev and the Linux VM/Docker image
# (some nvidia-* releases are Linux-only).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchhelp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that exercise several components together (no network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
