# Alembic configuration for developer commands (`alembic revision --autogenerate`, ...).
# The application itself runs migrations through researchhelp.db.migrate.upgrade().
[alembic]
script_location = src/researchhelp/db/migrations
# The database URL comes from Settings (DATABASE_URL) in migrations/env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
