# Evaluation / demo corpus: retrieval-augmented generation and dense retrieval.
# Chosen because the papers share datasets (Natural Questions, TriviaQA, ...) and
# methods (dense retrievers, reader/generator models), which makes multi-paper
# comparison questions meaningful. PDFs are downloaded by scripts/download_papers.py
# and are NOT committed to the repository.
papers:
  - arxiv_id: "2005.11401"
    short_name: rag
    title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
  - arxiv_id: "2004.04906"
    short_name: dpr
    title: "Dense Passage Retrieval for Open-Domain Question Answering"
  - arxiv_id: "2002.08909"
    short_name: realm
    title: "REALM: Retrieval-Augmented Language Model Pre-Training"
  - arxiv_id: "2007.01282"
    short_name: fid
    title: "Leveraging Passage Retrieval with Generative Models for Open Domain Question Answering"
  - arxiv_id: "2004.12832"
    short_name: colbert
    title: "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT"
  - arxiv_id: "2112.04426"
    short_name: retro
    title: "Improving Language Models by Retrieving from Trillions of Tokens"
  - arxiv_id: "2310.11511"
    short_name: self_rag
    title: "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection"
  - arxiv_id: "2212.10496"
    short_name: hyde
    title: "Precise Zero-Shot Dense Retrieval without Relevance Labels"
