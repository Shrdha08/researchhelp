# Phase 0: infrastructure only. Backend and frontend services are added in Phase 7.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # REST + dashboard (/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: researchhelp
      POSTGRES_PASSWORD: researchhelp
      POSTGRES_DB: researchhelp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchhelp"]
      interval: 5s
      retries: 10

volumes:
  qdrant_storage:
  pgdata:
